[project]
name = "agent-eval-harness"
version = "0.3.0"
description = "Minimal agent evaluation harness with true hidden-check separation: seed repo + public tests to the agent, pristine hidden tests only at grading time."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orazio Oztas" }]
dependencies = []

[project.optional-dependencies]
# ruff ha un upper bound deliberato. Con `ruff>=0.5` la CI installa sempre
# l'ultima: il 27/07 la 0.16.0 ha allargato le regole di default (PLW1510,
# UP017, BLE001…) e la CI è diventata rossa su codice non toccato da giorni.
# Un linter non vincolato rende il lint non riproducibile — inaccettabile in un
# repo il cui punto è la riproducibilità. Alzare il bound è una scelta esplicita,
# non una sorpresa a push già fatto.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16,<0.17"]

[project.scripts]
aeh = "aeh.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["src/aeh"]
